<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./schedule_backup.css"> <!-- Your CSS file -->
</head>
<body>

  <form class="pickup-form">
    <h2>Schedule a Pickup</h2>

    <label for="pickupDate">Pickup Date & Time</label>
    <input type="datetime-local" id="pickupDate" name="pickupDate" required>

    <label for="itemCount">Number of Items</label>
    <input type="number" id="itemCount" name="itemCount" min="1" required>

    <label for="pickupLocation">Pickup Location</label>
    <textarea id="pickupLocation" name="pickupLocation" rows="3" placeholder="Enter full address..." required></textarea>

    <label for="itemType">Type of Items</label>
    <select id="itemType" name="itemType" required>
      <option value="">Select</option>
      <option value="clothes">Clothes</option>
      <option value="books">Books</option>
      <option value="electronics">Electronics</option>
      <option value="other">Other</option>
    </select>

    <button type="submit" class="btn">Confirm Pickup</button>
  </form>

</body>
</html>
